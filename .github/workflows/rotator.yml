name: NanamiWork Rotator (Windows Test Channel)

on:
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: "Publish to rotator-test pre-release on GitHub"
        type: boolean
        default: true
  push:
    tags:
      - "*rotator*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (NSIS)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"
      ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/" 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify private profile migration
        run: node --test apps/desktop/electron/nanami-profile.test.mjs

      - name: Build Electron app
        run: pnpm --filter @openwork/desktop build:electron
        env:
          SIGN_WINDOWS: "false"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # These tests import workspace packages whose dist exports are produced by
      # build:electron. A clean runner has no pre-existing local build artifacts.
      - name: Verify app types
        run: pnpm --dir apps/app exec tsc -p tsconfig.json --noEmit

      - name: Verify account isolation
        working-directory: apps/server
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ../../scripts/ci-test.ps1 -TestFile test/nanami-isolation-accounts.test.ts

      - name: Verify plugin directory isolation
        working-directory: apps/server
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ../../scripts/ci-test.ps1 -TestFile test/opencode-plugin-deps.test.ts -Filter NanamiWork

      - name: Verify conversation sidebar
        working-directory: apps/app
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ../../scripts/ci-test.ps1 -TestFile tests/use-workspace-route-state.test.tsx

      - name: Verify session timeout handling
        working-directory: apps/app
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ../../scripts/ci-test.ps1 -TestFile tests/opencode-config-error.test.ts

      - name: Verify both packaged engines across restart
        working-directory: apps/server
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ../../scripts/ci-test.ps1 -TestFile test/nanami-isolation-native.test.ts -UseNode
        env:
          NANAMI_TEST_V1_BIN: ${{ github.workspace }}\apps\desktop\resources\sidecars\opencode.exe
          NANAMI_TEST_V2_BIN: ${{ github.workspace }}\apps\desktop\resources\sidecars\opencode2.exe

      - name: Restore electron-builder download cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~\AppData\Local\electron-builder\Cache
            ~\AppData\Local\electron\Cache
          key: eb-cache-win-${{ github.run_id }}
          restore-keys: |
            eb-cache-win-

      - name: Package Windows installer
        shell: pwsh
        run: |
          $success = $false
          for ($i = 1; $i -le 8; $i++) {
            Write-Host "Packaging Windows installer (attempt $i/8)..."
            pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --win nsis --publish never
            if ($LASTEXITCODE -eq 0) {
              $success = $true
              break
            }
            Write-Warning "electron-builder failed with exit code $LASTEXITCODE. Retrying in 10s..."
            Start-Sleep -Seconds 10
          }
          if (-not $success) {
            exit 1
          }
        env:
          SIGN_WINDOWS: "false"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save electron-builder download cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~\AppData\Local\electron-builder\Cache
            ~\AppData\Local\electron\Cache
          key: eb-cache-win-${{ github.run_id }}

      - name: Upload Windows test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rotator-windows-installer
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/dist-electron/*.exe

  publish-rotator:
    name: Publish Rotator Test Pre-release
    needs: [build-windows]
    if: always() && needs.build-windows.result == 'success' && (github.event_name == 'push' || github.event.inputs.publish_prerelease == 'true' || github.event.inputs.publish_prerelease == true)
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: rotator-windows-installer
          path: rotator-assets

      - name: List downloaded artifacts
        run: ls -la rotator-assets

      - name: Create or Update Rotator Test Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "rotator-test"
          target_commitish: ${{ github.sha }}
          name: "NanamiWork Rotator (Windows Test Channel)"
          draft: false
          prerelease: true
          files: rotator-assets/*.exe
          generate_release_notes: false
          body: |
            ### 🧪 NanamiWork Rotator (Windows Test Channel)

            > [!NOTE]
            > This is an automated **Windows-only test build** intended for quick local testing and verification.
            > It is flagged as a **Pre-release** and is deliberately isolated from the stable auto-update feed (`latest`).
            > Stable desktop installations will **NOT** be prompted to update to this test build.

            - **Target OS**: Windows (x64 NSIS Installer)
            - **Commit**: ${{ github.sha }}
            - **Channel**: Rotator (Test)

            Once verified on Windows, trigger **NanamiWork Completer** (`release:completer`) to build all platforms (Windows, Linux, macOS) and publish the official production release.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
