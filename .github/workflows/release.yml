name: NanamiWork Completer (Multi-Platform Release)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.8)"
        required: false
        default: "v1.2.8"
  push:
    tags:
      - "v*"
      - "!*rotator*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (NSIS & AppX)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Stamp release version
        run: node scripts/release/stamp-version.mjs --version "${{ inputs.tag || github.ref_name }}"

      - name: Build Electron app
        run: pnpm --filter @openwork/desktop build:electron
        env:
          SIGN_WINDOWS: "false"

      - name: Verify app types
        run: pnpm --dir apps/app exec tsc -p tsconfig.json --noEmit

      - name: Verify router, picker and activity cards
        working-directory: apps/app
        shell: pwsh
        run: |
          foreach ($test in @("tests/model-picker-account-grid.test.tsx", "tests/local-model-picker-preference.test.ts", "tests/sidebar-activity-ticker.test.tsx", "tests/text-activity-cards.test.tsx", "tests/markdown-math.test.ts", "tests/markdown-math-dom.test.ts", "tests/provider-auth-load-error.test.ts", "tests/session-provider-auth-error.test.ts", "tests/opencode-stream-timeout.test.ts", "tests/context-usage.test.ts", "tests/managed-disabled-providers.test.ts", "tests/antigravity-router-account.test.ts", "tests/local-router-dispatch.test.ts", "tests/local-router-runtime.test.ts", "tests/nanami-local-router.test.ts")) {
            bun test $test --timeout 30000
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Package Windows installer
        run: pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --win nsis appx --publish never
        env:
          SIGN_WINDOWS: "false"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          if-no-files-found: error
          path: |
            apps/desktop/dist-electron/*.exe
            apps/desktop/dist-electron/*.appx
            apps/desktop/dist-electron/*.msix
            apps/desktop/dist-electron/latest*.yml

  build-linux:
    name: Build Linux (AppImage & Debian)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Stamp release version
        run: node scripts/release/stamp-version.mjs --version "${{ inputs.tag || github.ref_name }}"

      - name: Build Electron app
        run: pnpm --filter @openwork/desktop build:electron

      - name: Package Linux (AppImage & Debian)
        run: pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --linux AppImage deb --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          if-no-files-found: error
          path: |
            apps/desktop/dist-electron/*.AppImage
            apps/desktop/dist-electron/*.deb
            apps/desktop/dist-electron/latest-linux*.yml

  build-macos:
    name: Build macOS (DMG & Zip)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Stamp release version
        run: node scripts/release/stamp-version.mjs --version "${{ inputs.tag || github.ref_name }}"

      - name: Build Electron app
        run: pnpm --filter @openwork/desktop build:electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Package macOS DMG & Zip
        run: pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --mac dmg zip --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          if-no-files-found: error
          path: |
            apps/desktop/dist-electron/*.dmg
            apps/desktop/dist-electron/*.zip
            apps/desktop/dist-electron/latest-mac*.yml

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || 'v1.2.8' }}
          target_commitish: ${{ github.sha }}
          name: "NanamiWork ${{ inputs.tag || github.ref_name || 'v1.2.8' }}: Microsoft Store, Cross-Platform & Safety Update"
          draft: false
          prerelease: false
          files: release-assets/*
          generate_release_notes: false
          body: |
            **NanamiWork ${{ inputs.tag || github.ref_name || 'v1.2.8' }}** hardens the Microsoft Store (AppX/MSIX) package, fixes macOS and Linux updater and process-management bugs, and removes OS-level Computer Use while keeping the embedded browser intact.

            ### Microsoft Store (AppX/MSIX) Fixes
            - Ship real NanamiWork AppX tile icons (`StoreLogo`, `Square44x44Logo`, `Square150x150Logo`, `Wide310x150Logo`) so Windows Store and Start Menu tiles display NanamiWork branding instead of default Electron placeholders.
            - Guard `app.setAppUserModelId`, protocol client registration, and custom Start Menu shortcut writes when running inside the Microsoft Store MSIX sandbox (`process.windowsStore`).
            - Properly report Store-managed builds as `supported: false` in `updaterEnvironment` and `setChannel`, and show an idle Store-managed status instead of an error state in Settings.

            ### macOS & Linux Cross-Platform Fixes
            - Fix macOS Squirrel.Mac `ShipIt` defaults domain to `ai.nanami.workbench.ShipIt` so macOS updates use DirectContentsWrite and clean stale ShipIt caches properly.
            - Fix architecture mismatch manifest matching and fallback asset names to match `NanamiWork-<version>-<os>-<arch>.<ext>`, and pick platform-appropriate release assets in the GitHub updater fallback.
            - Spawn POSIX background tasks in their own process group (`detached: true`) and terminate the full process group (`-pid`) on stop so grandchild processes are never orphaned on macOS/Linux.
            - Enrich macOS/Linux desktop terminal `PATH` with `/opt/homebrew/bin` and `/usr/local/bin`, and use UTF-8 safe base64 encoding for account sync and OAuth scripts so non-ASCII usernames never break.
            - Update macOS `Info.plist` permission descriptions (`NSMicrophoneUsageDescription`, `NSAppleEventsUsageDescription`) to NanamiWork wording.

            ### Safety, Browser & Session Polish
            - Disable OS-level Computer Use completely across runtime config, agent tools, and renderer UI while preserving the embedded NanamiWork browser and its Chrome DevTools integration.
            - Restore automatic AI session title generation by letting OpenCode generate concise task titles instead of pre-filling the raw first chat message as the session name.

            ### Notes
            - Model access still depends on the selected account's provider entitlements.
            - Windows installers are unsigned, and macOS packages are not notarized.

            ### Downloads
            - **Windows**: NSIS installer and AppX package
            - **macOS**: Apple Silicon DMG and ZIP
            - **Linux**: x86-64 AppImage and Debian package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
