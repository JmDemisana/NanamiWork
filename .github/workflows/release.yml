name: NanamiWork Completer (Multi-Platform Release)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.0)"
        required: false
        default: "v1.2.2"
  push:
    tags:
      - "v*"
      - "!*rotator*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (NSIS & AppX)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Stamp release version
        run: node scripts/release/stamp-version.mjs --version "${{ inputs.tag || github.ref_name }}"

      - name: Build Electron app
        run: pnpm --filter @openwork/desktop build:electron
        env:
          SIGN_WINDOWS: "false"

      - name: Verify app types
        run: pnpm --dir apps/app exec tsc -p tsconfig.json --noEmit

      - name: Verify router, picker and activity cards
        working-directory: apps/app
        shell: pwsh
        run: |
          foreach ($test in @("tests/model-picker-account-grid.test.tsx", "tests/local-model-picker-preference.test.ts", "tests/sidebar-activity-ticker.test.tsx", "tests/text-activity-cards.test.tsx", "tests/provider-auth-load-error.test.ts", "tests/antigravity-router-account.test.ts", "tests/local-router-dispatch.test.ts", "tests/local-router-runtime.test.ts", "tests/nanami-local-router.test.ts")) {
            bun test $test --timeout 30000
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Package Windows installer
        run: pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --win nsis appx --publish never
        env:
          SIGN_WINDOWS: "false"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          if-no-files-found: error
          path: |
            apps/desktop/dist-electron/*.exe
            apps/desktop/dist-electron/*.appx
            apps/desktop/dist-electron/*.msix
            apps/desktop/dist-electron/latest*.yml

  build-linux:
    name: Build Linux (AppImage & Debian)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Stamp release version
        run: node scripts/release/stamp-version.mjs --version "${{ inputs.tag || github.ref_name }}"

      - name: Build Electron app
        run: pnpm --filter @openwork/desktop build:electron

      - name: Package Linux (AppImage & Debian)
        run: pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --linux AppImage deb --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          if-no-files-found: error
          path: |
            apps/desktop/dist-electron/*.AppImage
            apps/desktop/dist-electron/*.deb
            apps/desktop/dist-electron/latest-linux*.yml

  build-macos:
    name: Build macOS (DMG & Zip)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Stamp release version
        run: node scripts/release/stamp-version.mjs --version "${{ inputs.tag || github.ref_name }}"

      - name: Build Electron app
        run: pnpm --filter @openwork/desktop build:electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Package macOS DMG & Zip
        run: pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --mac dmg zip --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          if-no-files-found: error
          path: |
            apps/desktop/dist-electron/*.dmg
            apps/desktop/dist-electron/*.zip
            apps/desktop/dist-electron/latest-mac*.yml

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || 'v1.2.2' }}
          target_commitish: ${{ github.sha }}
          name: "NanamiWork ${{ inputs.tag || github.ref_name || 'v1.2.2' }}: Local Router Bugfix"
          draft: false
          prerelease: false
          files: release-assets/*
          generate_release_notes: false
          body: |
            **NanamiWork ${{ inputs.tag || github.ref_name || 'v1.2.2' }}** fixes local router account rotation and improves activity visibility.

            ### Local Router
            - Retry account selection after quota refresh and rotate to an eligible account when quota is exhausted.
            - Recover Antigravity account identities from saved credentials and avoid selecting an ambiguous account.
            - Preserve the active model and account for steering an ongoing turn.

            ### Interface
            - Make sidebar activity animation easier to see.
            - Improve command, output, code and diff card readability.
            - Remove the full-page model picker switch; standalone desktops use the full-page picker while managed restrictions remain respected.

            ### Notes
            - Windows installers are unsigned, and macOS packages are not notarized.
            - Windows dictation uses Windows voice typing if its bundled helper is unavailable.

            ### Downloads
            - **Windows**: NSIS installer and AppX package
            - **macOS**: DMG and ZIP
            - **Linux**: AppImage and Debian package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
