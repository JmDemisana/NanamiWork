name: NanamiWork Completer (Multi-Platform Release)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.0)"
        required: false
        default: "v1.2.0"
  push:
    tags:
      - "v*"
      - "!*rotator*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (NSIS & AppX)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Stamp release version
        run: node scripts/release/stamp-version.mjs --version "${{ inputs.tag || github.ref_name }}"

      - name: Build Electron app
        run: pnpm --filter @openwork/desktop build:electron
        env:
          SIGN_WINDOWS: "false"

      - name: Package Windows installer
        run: pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --win nsis appx --publish never
        env:
          SIGN_WINDOWS: "false"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          if-no-files-found: error
          path: |
            apps/desktop/dist-electron/*.exe
            apps/desktop/dist-electron/*.appx
            apps/desktop/dist-electron/*.msix
            apps/desktop/dist-electron/latest*.yml

  build-linux:
    name: Build Linux (AppImage & Debian)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Stamp release version
        run: node scripts/release/stamp-version.mjs --version "${{ inputs.tag || github.ref_name }}"

      - name: Build Electron app
        run: pnpm --filter @openwork/desktop build:electron

      - name: Package Linux (AppImage & Debian)
        run: pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --linux AppImage deb --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          if-no-files-found: error
          path: |
            apps/desktop/dist-electron/*.AppImage
            apps/desktop/dist-electron/*.deb
            apps/desktop/dist-electron/latest-linux*.yml

  build-macos:
    name: Build macOS (DMG & Zip)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Stamp release version
        run: node scripts/release/stamp-version.mjs --version "${{ inputs.tag || github.ref_name }}"

      - name: Build Electron app
        run: pnpm --filter @openwork/desktop build:electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Package macOS DMG & Zip
        run: pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --mac dmg zip --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          if-no-files-found: error
          path: |
            apps/desktop/dist-electron/*.dmg
            apps/desktop/dist-electron/*.zip
            apps/desktop/dist-electron/latest-mac*.yml

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || 'v1.2.0' }}
          target_commitish: ${{ github.sha }}
          name: "NanamiWork ${{ inputs.tag || github.ref_name || 'v1.2.0' }}: Model Picker Overhaul and NanamiWork Local Router"
          draft: false
          prerelease: false
          files: release-assets/*
          generate_release_notes: false
          body: |
            **NanamiWork ${{ inputs.tag || github.ref_name || 'v1.2.0' }}** overhauls model selection and adds the NanamiWork Local Router for rotating across connected provider accounts and their available models.

            ### Model Picker Overhaul
            - Reworked model selection into a searchable, grouped picker with account-aware model choices.
            - Router candidates come from models available in the picker, so it does not invent hidden provider models.
            - Added per-model and per-account inclusion, ordering, and routing strategies, including **Earliest to reset** and **Latest to reset**.
            - The router tries another eligible picker candidate after an explicit model/account rejection, while avoiding replay on timeouts, rate limits, and ambiguous failures.
            - Sidebar router status shows the account and model used by the most recent successful routed turn.
            - The router status is shown only while Local Router is selected; choosing a concrete model restores its regular provider quota widget, even when the router used that model on the previous turn.

            ### NanamiWork Local Router
            - Routing stays inside NanamiWork; OpenCode receives the selected provider model for each turn.
            - ChatGPT, Copilot, and Antigravity accounts can participate when connected and eligible.
            - Steers stay with the model already serving that conversation instead of switching accounts mid-turn.

            ### Chat and Sidebar
            - Undo waits for the server to confirm the revert before restoring the prompt.
            - Manual transcript scrolling no longer races two competing anchor corrections, and a live-turn spacer that could leave blank scroll has been removed.
            - Finished turns keep the assistant conclusion visible and tuck completed activity under one **Summary of Turn** control. Interrupted work and errors remain visible.
            - Search and Settings now sit in the sidebar's top titlebar row, using the otherwise empty space.

            ### 📦 Downloads & Installers
            - **Windows**: NSIS installer and Microsoft Store package
            - **macOS**: DMG and ZIP
            - **Linux**: AppImage and Debian package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
