name: NanamiWork Completer (Multi-Platform Release)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.1.1)"
        required: false
        default: "v1.1.3"
  push:
    tags:
      - "v*"
      - "!*rotator*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (NSIS & AppX)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Electron app
        run: pnpm --filter @openwork/desktop build:electron
        env:
          SIGN_WINDOWS: "false"

      - name: Package Windows installer
        run: pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --win nsis appx --publish never
        env:
          SIGN_WINDOWS: "false"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          if-no-files-found: error
          path: |
            apps/desktop/dist-electron/*.exe
            apps/desktop/dist-electron/*.appx
            apps/desktop/dist-electron/*.msix
            apps/desktop/dist-electron/latest*.yml

  build-linux:
    name: Build Linux (AppImage & Debian)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Electron app
        run: pnpm --filter @openwork/desktop build:electron

      - name: Package Linux (AppImage & Debian)
        run: pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --linux AppImage deb --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          if-no-files-found: error
          path: |
            apps/desktop/dist-electron/*.AppImage
            apps/desktop/dist-electron/*.deb
            apps/desktop/dist-electron/latest-linux*.yml

  build-macos:
    name: Build macOS (DMG & Zip)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Electron app
        run: pnpm --filter @openwork/desktop build:electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Package macOS DMG & Zip
        run: pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --mac dmg zip --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          if-no-files-found: error
          path: |
            apps/desktop/dist-electron/*.dmg
            apps/desktop/dist-electron/*.zip
            apps/desktop/dist-electron/latest-mac*.yml

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || 'v1.1.3' }}
          target_commitish: ${{ github.sha }}
          name: "NanamiWork 1.1.3 Critical Update: Isolation and Session Storage Retrieval Fix"
          draft: false
          prerelease: false
          files: release-assets/*
          generate_release_notes: false
          body: |
            **NanamiWork v1.1.3** is a critical update for profile isolation and reliable session storage retrieval, paired with a cleaner sidebar, simplified Preferences, and fixed prompt navigation.

            ### 🛠 Critical Fixes
            - **Session Storage Retrieval**:
              - Workspace directories are normalized to forward slashes before every session query, so OpenCode's SQLite exact-match lookups keep finding chats after a restart on Windows.
              - Cold-boot session loading no longer waits for engine routing to be resolved before the first fetch.
              - Packaged engines are verified across a full restart to confirm both private and legacy session stores load.
            - **Profile & Engine Isolation**:
              - Private profile migration and plugin directory isolation remain enforced, keeping NanamiWork credentials, plugins, and caches separate from global OpenCode, OpenWork, and other agent installations.
              - NanamiWork no longer registers OpenWork's link scheme or removes OpenWork's shortcut marker during uninstall.
            - **Update Eligibility**:
              - Public NanamiWork updates use the NanamiWork release feed without relying on OpenWork's version catalog. Store-managed installs continue to use their store's updates.
            - **Cold-Engine Resilience**:
              - Session list loading tolerates missing HTTP responses and extends bounded retries, so a slow-starting engine no longer drops the conversation list.

            ### ✨ UI Cleanup
            - **Sidebar**:
              - Every session is visible at once; the "Show 6 more" pagination is gone.
              - A labeled **Create workspace** button now sits directly below **New session**.
              - The Feed view and Workspaces/Feed switcher are removed.
            - **Preferences**:
              - Removed the Model and Privacy groups and their toggles.
              - Model reasoning stays on and anonymous usage sharing stays off.
            - **Prompt Navigation**:
              - Previous/Next Prompt now steps strictly to the adjacent prompt instead of re-selecting the current one.
              - PageUp and PageDown navigate prompts from the transcript and composer, with guards for dialogs, menus, other scroll regions, and split panes.

            ### 📦 Downloads & Installers
            - **Windows**: `NanamiWork-1.1.3-win-x64.exe` (NSIS Installer) & `NanamiWork-1.1.3-win-x64.appx` (Microsoft Store Package)
            - **macOS**: `NanamiWork-1.1.3-mac-arm64.dmg` / `.zip` (Apple Silicon)
            - **Linux**: `NanamiWork-1.1.3-linux-x86_64.AppImage` / `NanamiWork-1.1.3-linux-amd64.deb`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
