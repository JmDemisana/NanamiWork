name: Release NanamiWork

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (NSIS)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Electron app
        run: pnpm --filter @openwork/desktop build:electron
        env:
          SIGN_WINDOWS: "false"

      - name: Package Windows installer
        run: pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --win nsis --publish never
        env:
          SIGN_WINDOWS: "false"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          if-no-files-found: error
          path: |
            apps/desktop/dist-electron/*.exe
            apps/desktop/dist-electron/*.appx
            apps/desktop/dist-electron/*.msix
            apps/desktop/dist-electron/latest*.yml

  build-linux:
    if: false
    name: Build Linux (AppImage & Debian)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Electron app
        run: pnpm --filter @openwork/desktop build:electron

      - name: Package Linux (AppImage & Debian)
        run: pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --linux AppImage deb --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          if-no-files-found: error
          path: |
            apps/desktop/dist-electron/*.AppImage
            apps/desktop/dist-electron/*.deb
            apps/desktop/dist-electron/latest-linux*.yml

  build-macos:
    if: false
    name: Build macOS (DMG & Zip)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Electron app
        run: pnpm --filter @openwork/desktop build:electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Package macOS DMG & Zip
        run: pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --mac dmg zip --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          if-no-files-found: error
          path: |
            apps/desktop/dist-electron/*.dmg
            apps/desktop/dist-electron/*.zip
            apps/desktop/dist-electron/latest-mac*.yml

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.1.1' }}
          name: "NanamiWork ${{ github.ref_type == 'tag' && github.ref_name || 'v1.1.1' }}"
          draft: false
          prerelease: false
          files: release-assets/*
          generate_release_notes: false
          body: |
            # 🌸 NanamiWork ${{ github.ref_type == 'tag' && github.ref_name || 'v1.1.1' }} (Hotfix)

            **NanamiWork v1.1.1** is a critical hotfix release addressing desktop UI branding, timeline rewind modal styling, and active model persistence.

            ### 🩹 Hotfix Highlights & Improvements
            - **Official NanamiWork Branding**: Restored `NanamiWork` product name across Windows Installed Apps, Start Menu shortcuts, window title bar, and startup screen.
            - **Undo Rewind Modal Overhaul**: Replaced the previous clipped container with the authentic design-system `ConfirmModal` (Base UI Dialog portal to `document.body`) featuring soft backdrop blur, centered placement, and keyboard autofocus.
            - **Model Selection & Anti-Flicker**:
              - Fixed combobox auto-highlighting that previously made `Gemini 🔥` appear selected on open; the true active model is now clearly badged and highlighted.
              - Selecting a model in any chat now locks as the persistent default across sessions.
              - Creating a new task (`+` / `Ctrl+N`) strictly preserves your currently active model without resetting to starter models.
              - Desktop account models (Antigravity, Copilot, ChatGPT, Nanami router) are permanently guarded against false-positive "unavailable" auto-switches while background accounts load.

            ### 📦 Downloads & Installers
            - **Windows**: `NanamiWork-1.1.1-win-x64.exe` (NSIS Installer)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}