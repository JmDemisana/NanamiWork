name: Release NanamiWork

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (NSIS)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Electron app
        run: pnpm --filter @openwork/desktop build:electron
        env:
          SIGN_WINDOWS: "false"

      - name: Package Windows installer
        run: pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --win nsis --publish never
        env:
          SIGN_WINDOWS: "false"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          if-no-files-found: error
          path: |
            apps/desktop/dist-electron/*.exe

  build-linux:
    name: Build Linux (AppImage & Debian)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Electron app
        run: pnpm --filter @openwork/desktop build:electron

      - name: Package Linux (AppImage & Debian)
        run: pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --linux AppImage deb --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          if-no-files-found: error
          path: |
            apps/desktop/dist-electron/*.AppImage
            apps/desktop/dist-electron/*.deb

  build-macos:
    name: Build macOS (DMG & Zip)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Electron app
        run: pnpm --filter @openwork/desktop build:electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Package macOS DMG & Zip
        run: pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --mac dmg zip --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          if-no-files-found: error
          path: |
            apps/desktop/dist-electron/*.dmg
            apps/desktop/dist-electron/*.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.1.0' }}
          name: "NanamiWork ${{ github.ref_type == 'tag' && github.ref_name || 'v1.1.0' }}"
          draft: false
          prerelease: false
          files: release-assets/*
          generate_release_notes: false
          body: |
            # 🌸 NanamiWork ${{ github.ref_type == 'tag' && github.ref_name || 'v1.1.0' }}

            **NanamiWork** is an agent instance manager and unified desktop frontend bringing your **Google Antigravity**, **Codex (ChatGPT)**, and **GitHub Copilot** accounts together.

            *(Note: The built-in Nanami Gateway section is a private, optional utility reserved for trusted peers with a Gate PIN. The core application is entirely powered by your own connected developer instances and accounts.)*

            ### 📦 Downloads & Installers
            - **Windows**: `Nanami-*-windows-*.exe` (NSIS Installer)
            - **Linux (Debian/Ubuntu)**: `Nanami-*-linux-*.deb`
            - **Linux (Universal)**: `Nanami-*-linux-*.AppImage`
            - **macOS**: `Nanami-*-mac-*.dmg` / `.zip`

            ### ✨ What's New in v1.1.0
            - **Unified 3-in-1 Agent Instance Manager**: Easily connect and switch across Google Antigravity, Codex (ChatGPT), and GitHub Copilot with 1-click device & browser authorization.
            - **GitHub Copilot Integration**: Full personal account support (Student Developer Pack & Individual) via 1-click GitHub device authorization, automatic model discovery (`gpt-4.1` Auto routing), and live monthly quota monitoring.
            - **Multi-Account Codex (ChatGPT)**: Dynamic rolling limit monitoring (5-hour, weekly, monthly) with reasoning effort selector (Low / Medium / High).
            - **Visual & Modal Parity**: Consistent, clean card designs across all platform auth dialogs and model picker lists.
            - **Strict Sandbox Isolation**: NanamiWork runs completely inside `~/.config/nanamiwork` and `~/.config/nanamiwork/data`, with zero pollution or conflicts with standalone OpenCode, OpenWork, VS Code Copilot, or Codex installations.
            - **Undo Up to This Point**: Timeline rewinding restoring prompt drafts directly into composer with autofocus.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
