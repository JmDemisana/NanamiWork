name: NanamiWork Completer (Multi-Platform Release)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.1.1)"
        required: false
        default: "v1.1.2"
  push:
    tags:
      - "v*"
      - "!*rotator*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (NSIS & AppX)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Electron app
        run: pnpm --filter @openwork/desktop build:electron
        env:
          SIGN_WINDOWS: "false"

      - name: Package Windows installer
        run: pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --win nsis appx --publish never
        env:
          SIGN_WINDOWS: "false"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          if-no-files-found: error
          path: |
            apps/desktop/dist-electron/*.exe
            apps/desktop/dist-electron/*.appx
            apps/desktop/dist-electron/*.msix
            apps/desktop/dist-electron/latest*.yml

  build-linux:
    name: Build Linux (AppImage & Debian)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Electron app
        run: pnpm --filter @openwork/desktop build:electron

      - name: Package Linux (AppImage & Debian)
        run: pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --linux AppImage deb --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          if-no-files-found: error
          path: |
            apps/desktop/dist-electron/*.AppImage
            apps/desktop/dist-electron/*.deb
            apps/desktop/dist-electron/latest-linux*.yml

  build-macos:
    name: Build macOS (DMG & Zip)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Electron app
        run: pnpm --filter @openwork/desktop build:electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Package macOS DMG & Zip
        run: pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --mac dmg zip --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          if-no-files-found: error
          path: |
            apps/desktop/dist-electron/*.dmg
            apps/desktop/dist-electron/*.zip
            apps/desktop/dist-electron/latest-mac*.yml

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || 'v1.1.2' }}
          name: "NanamiWork ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || 'v1.1.2' }}"
          draft: false
          prerelease: false
          files: release-assets/*
          generate_release_notes: false
          body: |
            **NanamiWork ${{ github.ref_type == 'tag' && github.ref_name || 'v1.1.2' }}** is a compatibility and hotfix release featuring Microsoft Store packaging compliance, model selection guards, always-expanded thought traces, background shell commands, and critical UI runtime hotfixes.

            ### 🚀 Highlights & Improvements
            - **Microsoft Store & WinGet Compliance**:
              - Auto-updater safely isolated for Store/WinGet distributions to comply with Microsoft Store certification policies.
              - Native App menu "Check for Updates..." and Settings > Updates display store-managed notices when running under Store sandboxes.
              - Full AppX package generation for Microsoft Partner Center deployment alongside NSIS installers.
            - **Composer Model Retention & Safety Guards**:
              - Typing drafts in new sessions strictly retains the user-selected model rather than resetting to starter states.
              - Send button is disabled and Enter key redirects to the model picker if no valid model is picked, preventing empty model requests.
            - **Always-Expanded Thought Traces & Workbench Steps**:
              - Removed collapsible dropdown chevron from reasoning blocks so thought processes and duration statistics render expanded by default.
              - Workbench tool steps and disclosures default to open for clear pair-programming visibility.
            - **Run Running Command in Background**:
              - Added instant "Run in background" quick button and dropdown action on active terminal commands, seamlessly converting running tasks into background shell jobs.
            - **Critical UI Hotfixes**:
              - Fixed `ReferenceError: Cannot access 'x' before initialization` in tool aggregate groups by resolving Temporal Dead Zone (TDZ) variable order.
              - Fixed `TypeError: Cannot read properties of undefined (reading 'find')` in composer model validation.
              - Fixed startup crash `ReferenceError: isStoreBuild is not defined` during application menu installation.

            ### 📦 Downloads & Installers
            - **Windows**: `NanamiWork-1.1.2-win-x64.exe` (NSIS Installer) & `NanamiWork-1.1.2-win-x64.appx` (Microsoft Store Package)
            - **macOS**: `NanamiWork-1.1.2-mac-universal.dmg` / `.zip` (Apple Silicon & Intel)
            - **Linux**: `NanamiWork-1.1.2-linux-x86_64.AppImage` / `nanamiwork_1.1.2_amd64.deb`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
