name: Diagnose engine isolation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @openwork/types build
      - run: node apps/desktop/scripts/prepare-sidecar.mjs --outdir apps/desktop/resources/sidecars
      - name: Diagnose isolated engine restart
        working-directory: apps/server
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ../../scripts/ci-test.ps1 -TestFile test/nanami-isolation-native.test.ts -UseNode
        env:
          NANAMI_TEST_V1_BIN: ${{ github.workspace }}\apps\desktop\resources\sidecars\opencode.exe
          NANAMI_TEST_V2_BIN: ${{ github.workspace }}\apps\desktop\resources\sidecars\opencode2.exe
